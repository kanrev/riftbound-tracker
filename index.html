<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Riftbound Point Tracker</title>

    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="stylesheet.css">
    <meta name="theme-color" content="#0a0a0f">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
</head>
<body>

    <div class="player-pane p2" id="pane2">
        <div class="turn-display" id="turnDisplay2">TURN 1</div>
        <div class="pane-center">
            <div class="player-name" id="p2Name" onclick="openRenameFromPane(2)">Player 2</div>
            <div class="score-display" id="p2Score">0</div>
        </div>
        <div class="btn-row">
            <div class="action-buttons">
                <button class="action-btn btn-conquer" onclick="scorePoint(2,'C')">Conquer</button>
                <button class="action-btn btn-hold"    onclick="scorePoint(2,'H')">Hold</button>
            </div>
            <button class="undo-btn" id="undoBtn2" onclick="undoAction(2)" disabled><span style="display:inline-block; transform:rotate(290deg);">&#8634;</span></button>
        </div>
        <button class="end-turn-btn" id="endTurnBtn2" onclick="nextTurn(2)">End Turn</button>
    </div>

    <div class="center-divider"></div>

    <div class="player-pane p1" id="pane1">
        <div class="turn-display" id="turnDisplay1">TURN 1</div>
        <div class="pane-center">
            <div class="player-name" id="p1Name" onclick="openRenameFromPane(1)">Player 1</div>
            <div class="score-display" id="p1Score">0</div>
        </div>
        <div class="btn-row">
            <div class="action-buttons">
                <button class="action-btn btn-conquer" onclick="scorePoint(1,'C')">Conquer</button>
                <button class="action-btn btn-hold"    onclick="scorePoint(1,'H')">Hold</button>
            </div>
            <button class="undo-btn" id="undoBtn1" onclick="undoAction(1)" disabled><span style="display:inline-block; transform:rotate(290deg);">&#8634;</span></button>
        </div>
        <button class="end-turn-btn" id="endTurnBtn1" onclick="nextTurn(1)">End Turn</button>
    </div>

    <div class="bottom-nav">
        <div class="pill"      onclick="newGame()">New Game</div>
        <div class="pill"      onclick="openLog()">Log</div>
        <div class="pill-icon" onclick="openSettings()" title="Settings">⚙️</div>
    </div>

    <div class="modal" id="settingsModal">
        <div class="modal-header">
            <h2>Settings</h2>
            <button class="close-modal" onclick="closeSettings()">×</button>
        </div>
        <div class="settings-list">
            <div class="settings-section-label">Players</div>
            <div class="settings-item rename-row">
                <div class="settings-item-label">
                    <div class="settings-item-desc">Player 1 Name</div>
                </div>
                <input  class="rename-input" id="renameInput1" type="text" maxlength="20" placeholder="Player 1" />
                <button class="rename-save-btn" onclick="saveName(1)">Save</button>
            </div>
            <div class="settings-item rename-row">
                <div class="settings-item-label">
                    <div class="settings-item-desc">Player 2 Name</div>
                </div>
                <input  class="rename-input" id="renameInput2" type="text" maxlength="20" placeholder="Player 2" />
                <button class="rename-save-btn" onclick="saveName(2)">Save</button>
            </div>
            <div class="settings-section-label" style="margin-top:16px;">Game Data</div>
            <div class="settings-item" onclick="openHistory()">
                <div class="settings-item-label">
                    <div class="settings-item-title">History</div>
                    <div class="settings-item-desc">View all saved games</div>
                </div>
                <div class="settings-item-icon">📋</div>
            </div>
            <div class="settings-item danger" onclick="clearHistory()">
                <div class="settings-item-label">
                    <div class="settings-item-title">Clear History</div>
                    <div class="settings-item-desc">Permanently delete all saved games</div>
                </div>
                <div class="settings-item-icon">🗑</div>
            </div>
        </div>
    </div>

    <div class="modal" id="historyModal">
        <div class="modal-header">
            <h2>Game History</h2>
            <button class="close-modal" onclick="closeHistory()">×</button>
        </div>
        <div class="game-list" id="gameList"></div>
    </div>

    <div class="modal" id="detailModal">
        <div class="modal-header">
            <div class="detail-nav-row">
                <button class="back-btn" onclick="backToList()">← Back</button>
                <div style="flex:1;"></div>
                <button class="delete-game-btn" id="deleteGameBtn">Delete</button>
                <button class="close-modal" onclick="closeHistory()">×</button>
            </div>
            <h2 id="detailTitle"></h2>
        </div>
        <div class="history-table">
            <div class="table-header">
                <div class="col-turn">TURN</div>
                <div class="col-player" id="detailP1Header">PLAYER 1</div>
                <div class="col-player" id="detailP2Header">PLAYER 2</div>
            </div>
            <div id="detailRows"></div>
        </div>
    </div>

    <div class="modal" id="logModal">
        <div class="modal-header">
            <h2>Current Game Log</h2>
            <button class="close-modal" onclick="closeLog()">×</button>
        </div>
        <div class="history-table" id="logContent">
            <div class="table-header">
                <div class="col-turn">TURN</div>
                <div class="col-player" id="logP1Header">PLAYER 1</div>
                <div class="col-player" id="logP2Header">PLAYER 2</div>
            </div>
            <div id="logRows"></div>
        </div>
    </div>

<script src="app.js"></script>
</body>
</html>
